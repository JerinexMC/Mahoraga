name: Build Mahoraga plugin
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mahoraga-Paper-1.21.11
          path: target/mahoraga-1.0.0.jar
